[package]
name = "filenym-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "filenym_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
filenym-app = { path = "../crates/filenym-app" }
filenym-infra = { path = "../crates/filenym-infra" }
filenym-core = { path = "../crates/filenym-core" }
filenym-ports = { path = "../crates/filenym-ports" }
serde = { version = "1", features = ["derive"] }
getrandom = "=0.4.3"
tauri-plugin-dialog = "=2.8.3"
tauri = { version = "2", features = [] }

[dev-dependencies]
serde_json = "1"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
